hwdec=auto
#hwdec=auto-copy
#hwdec=dxva2
#hwdec=dxva2-copy
#hwdec=d3d11va
#hwdec=d3d11va-copy
#hwdec=d3d12va
#hwdec=d3d12va-copy

#vf=d3d11vpp

hwdec-codecs=h264,vc1,hevc,vp9,av1

#log-file="C:\Bin\portable_config\logs\log.txt"

geometry=1152x648+50%+50%

ytdl-format='bestvideo[height<=?720][fps<=?30]+bestaudio/best'


# SUBTITLES
sub-auto=all
sub-font="Aptos Black"
sub-font-size=40


# AUDIO
#audio-spdif=ac3,dts,dts-hd,eac3,truehd
#af-add=scaletempo
#af-add=lavcac3enc=yes


[music]
profile-cond=audio_params["channel-count"] == 2

# AUDIO EQUALIZER (10 band): OFF
af-remove=lavfi=[equalizer=frequency=31:width_type=o:width=1:gain=0]     # 20-45
af-remove=lavfi=[equalizer=frequency=62:width_type=o:width=1:gain=0]       # 45-90
af-remove=lavfi=[equalizer=frequency=125:width_type=o:width=1:gain=0]      # 90-175
af-remove=lavfi=[equalizer=frequency=250:width_type=o:width=1:gain=0]    # 175-350
af-remove=lavfi=[equalizer=frequency=500:width_type=o:width=1:gain=0]    # 350-700
af-remove=lavfi=[equalizer=frequency=1000:width_type=o:width=1:gain=0]   # 700-1400
af-remove=lavfi=[equalizer=frequency=2000:width_type=o:width=1:gain=2]   # 1400-2800
af-remove=lavfi=[equalizer=frequency=4000:width_type=o:width=1:gain=4]   # 2800-6000
af-remove=lavfi=[equalizer=frequency=8000:width_type=o:width=1:gain=6]   # 6000-12000
af-remove=lavfi=[equalizer=frequency=16000:width_type=o:width=1:gain=12]   # 12000-20000

# AUDIO EQUALIZER (10 band): ON
af-add=lavfi=[equalizer=frequency=31:width_type=o:width=1:gain=0]     # 20-45
af-add=lavfi=[equalizer=frequency=62:width_type=o:width=1:gain=0]       # 45-90
af-add=lavfi=[equalizer=frequency=125:width_type=o:width=1:gain=0]      # 90-175
af-add=lavfi=[equalizer=frequency=250:width_type=o:width=1:gain=0]    # 175-350
af-add=lavfi=[equalizer=frequency=500:width_type=o:width=1:gain=0]    # 350-700
af-add=lavfi=[equalizer=frequency=1000:width_type=o:width=1:gain=0]   # 700-1400
af-add=lavfi=[equalizer=frequency=2000:width_type=o:width=1:gain=2]   # 1400-2800
af-add=lavfi=[equalizer=frequency=4000:width_type=o:width=1:gain=4]   # 2800-6000
af-add=lavfi=[equalizer=frequency=8000:width_type=o:width=1:gain=6]   # 6000-12000
af-add=lavfi=[equalizer=frequency=16000:width_type=o:width=1:gain=12]   # 12000-20000



[movie]
profile-cond=audio_params["channel-count"] ~= 2

# AUDIO EQUALIZER (10 band): OFF
af-remove=lavfi=[equalizer=frequency=31:width_type=o:width=1:gain=0]     # 20-45
af-remove=lavfi=[equalizer=frequency=62:width_type=o:width=1:gain=0]       # 45-90
af-remove=lavfi=[equalizer=frequency=125:width_type=o:width=1:gain=0]      # 90-175
